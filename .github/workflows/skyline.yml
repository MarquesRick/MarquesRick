name: skyline

on:
  schedule:
    - cron: "17 3 * * *"   # todo dia às 03:17 UTC (00:17 em Brasília)
  workflow_dispatch:        # permite rodar manualmente

permissions: {}             # por padrão, nenhuma permissão

jobs:
  draw:
    runs-on: ubuntu-latest
    permissions:
      contents: read        # só leitura: o código de terceiros não pode alterar seu repo
    steps:
      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Draw skyline
        env:
          GITHUB_TOKEN: ${{ secrets.SKYLINE_TOKEN || secrets.GITHUB_TOKEN }}
        run: go run github.com/pinkpixel-dev/skyline@latest -theme neon -svg skyline.svg "${{ github.repository_owner }}"

      - uses: actions/upload-artifact@v4
        with:
          name: skyline
          path: skyline.svg
          retention-days: 1

  publish:
    needs: draw
    runs-on: ubuntu-latest
    permissions:
      contents: write       # só este job pode gravar, e ele não roda código de terceiros
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: skyline

      - name: Publish to output branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          mkdir out && mv skyline.svg out/ && cd out
          git init -q -b skyline
          git add skyline.svg
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -qm "Update skyline"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${REPO}.git" skyline
